# Nginx configuration for chatbot proxy
# Place this in /etc/nginx/sites-available/faisalhanif.work or add to your existing config

server {
    listen 80;
    server_name faisalhanif.work www.faisalhanif.work;

    # Redirect HTTP to HTTPS (uncomment after SSL setup)
    # return 301 https://$server_name$request_uri;

    # For now, allow HTTP (remove this after SSL setup)
    location / {
        # Your static files location (Hostinger uploads)
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Proxy API requests to Node.js backend
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

