# Nginx configuration for chatbot proxy
# Place this in /etc/nginx/sites-available/faisalhanif.work or add to your existing config

# Chat rate limiting — first line of defense against floods; the Node backend enforces the exact
# per-visitor limits. limit_req_zone must be in the http {} context, which sites-available files are.
limit_req_zone $binary_remote_addr zone=chat_api:10m rate=6r/m;

server {
    listen 80;
    server_name faisalhanif.work www.faisalhanif.work;

    # Redirect HTTP to HTTPS (uncomment after SSL setup)
    # return 301 https://$server_name$request_uri;

    # For now, allow HTTP (remove this after SSL setup)
    location / {
        # Your static files location (Hostinger uploads)
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Chat endpoint: throttle floods before they reach Node (JSON 429 so the chat widget can show it)
    location = /api/chat {
        limit_req zone=chat_api burst=6 nodelay;
        limit_req_status 429;
        error_page 429 = @chat_rate_limited;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location @chat_rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":"Too many requests","code":"BURST_LIMIT","message":"Please slow down and try again in a minute.","retryAfter":60}';
    }

    # Proxy API requests to Node.js backend
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

