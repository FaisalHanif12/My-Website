<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PureBody Mobile App - Project Showcase" />
  <title>PureBody - Project Showcase</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animation.style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Favicon -->
  <link rel="icon" href="imgs/F-Logo3.png" type="image/png" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e8f5f3 100%);
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px 20px;
      position: relative;
    }

    /* Back Button - Upper Left Corner */
    .back-button {
      position: fixed;
      top: 20px;
      left: 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--dark-blue, #0e6655);
      text-decoration: none;
      font-weight: 500;
      font-size: 16px;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(14, 102, 85, 0.15);
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      z-index: 1000;
    }

    .back-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(14, 102, 85, 0.25);
      background: rgba(255, 255, 255, 1);
    }

    /* Header Section */
    .header {
      text-align: center;
      margin-bottom: 20px;
      margin-top: 10px;
      padding: 10px 0;
      animation: fadeInDown 0.8s ease-out;
      overflow: visible;
    }

    .back-button i {
      font-size: 14px;
    }

    .header h1 {
      font-size: 3.5rem;
      font-weight: 700;
      color: var(--dark-blue, #0e6655);
      margin: 0 0 15px 0;
      padding: 10px 0;
      line-height: 1.2;
      background: linear-gradient(135deg, #0e6655 0%, #10b981 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      overflow: visible;
      display: inline-block;
    }

    .header p {
      font-size: 1.2rem;
      color: #6b7280;
      font-weight: 400;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* Videos Grid - 3 per row */
    .videos-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
      margin-top: 10px;
      justify-items: center;
    }

    .video-card {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      animation: fadeInUp 0.8s ease-out;
      animation-fill-mode: both;
      width: 100%;
    }

    .video-card:nth-child(1) {
      animation-delay: 0.1s;
    }

    .video-card:nth-child(2) {
      animation-delay: 0.2s;
    }

    .video-card:nth-child(3) {
      animation-delay: 0.3s;
    }

    .video-card:nth-child(4) {
      animation-delay: 0.4s;
    }

    .video-card:nth-child(5) {
      animation-delay: 0.5s;
    }

    .video-card:nth-child(6) {
      animation-delay: 0.6s;
    }

    .video-card:hover {
      transform: translateY(-10px) scale(1.02);
    }

    /* Phone Frame */
    .phone-frame {
      position: relative;
      background: linear-gradient(145deg, #1a1a2e, #2d2d44, #1a1a2e);
      border-radius: 40px;
      padding: 12px;
      box-shadow:
        0 0 0 2px rgba(255, 255, 255, 0.1),
        0 20px 60px rgba(0, 0, 0, 0.3),
        inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      width: 100%;
      max-width: 300px;
      transition: box-shadow 0.4s ease;
    }

    .video-card:hover .phone-frame {
      box-shadow:
        0 0 0 2px rgba(14, 102, 85, 0.3),
        0 25px 80px rgba(14, 102, 85, 0.25),
        inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    /* Notch */
    .phone-frame::before {
      content: '';
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 22px;
      background: #0d0d15;
      border-radius: 0 0 14px 14px;
      z-index: 10;
    }

    /* Front camera dot */
    .phone-frame::after {
      content: '';
      position: absolute;
      top: 17px;
      left: 50%;
      transform: translateX(12px);
      width: 8px;
      height: 8px;
      background: radial-gradient(circle, #1e3a5f 40%, #0d1117 60%);
      border-radius: 50%;
      z-index: 11;
    }

    /* Side button accents */
    .phone-button-right {
      position: absolute;
      right: -3px;
      top: 100px;
      width: 3px;
      height: 40px;
      background: linear-gradient(180deg, #3d3d5c, #2d2d44);
      border-radius: 0 3px 3px 0;
    }

    .phone-button-left-1 {
      position: absolute;
      left: -3px;
      top: 80px;
      width: 3px;
      height: 25px;
      background: linear-gradient(180deg, #3d3d5c, #2d2d44);
      border-radius: 3px 0 0 3px;
    }

    .phone-button-left-2 {
      position: absolute;
      left: -3px;
      top: 120px;
      width: 3px;
      height: 45px;
      background: linear-gradient(180deg, #3d3d5c, #2d2d44);
      border-radius: 3px 0 0 3px;
    }

    .phone-screen {
      position: relative;
      width: 100%;
      border-radius: 28px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 9 / 19.5;
    }

    .phone-screen video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .video-card:hover .phone-screen video {
      /* No transform needed — the frame itself moves */
    }

    /* Hide video controls */
    .video-wrapper video::-webkit-media-controls {
      display: none !important;
    }

    .video-wrapper video::-webkit-media-controls-enclosure {
      display: none !important;
    }

    .video-wrapper video::-webkit-media-controls-panel {
      display: none !important;
    }

    /* Loading Animation */
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive Design */
    @media (max-width: 1200px) {
      .videos-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 25px;
      }
    }

    @media (max-width: 768px) {
      .container {
        padding: 20px 15px;
      }

      .back-button {
        top: 15px;
        left: 15px;
        font-size: 14px;
        padding: 10px 20px;
      }

      .header {
        margin-top: 20px;
        padding: 10px 0;
      }

      .header h1 {
        font-size: 2.5rem;
        padding: 5px 0;
        margin-top: 0;
      }

      .header p {
        font-size: 1rem;
      }

      .videos-grid {
        grid-template-columns: 1fr;
        gap: 20px;
        margin-top: 30px;
      }
    }

    @media (max-width: 480px) {
      .header {
        margin-top: 15px;
        padding: 5px 0;
      }

      .header h1 {
        font-size: 2rem;
        padding: 5px 0;
        margin-top: 0;
      }

      .back-button {
        top: 10px;
        left: 10px;
        font-size: 12px;
        padding: 8px 16px;
      }
    }

    /* Smooth Scroll */
    html {
      scroll-behavior: smooth;
    }
  </style>
</head>

<body>
  <!-- Back Button - Fixed Upper Left -->
  <a href="index.html" class="back-button">

  <div class="container">

          </div>

      <!-- Video 4 -->
      <div class="video-card">
        <div class="video-wrapper">
          <div class="phone-frame">

            <div class="phone-button-left-1"></div>

      <!-- Video 5 -->

      <!-- Video 6 -->
      <div class="video-card">
        <div class="video-wrapper">
          <div class="phone-frame">

      </div>
    </div>
  </div>

  <script>
    // Autoplay all videos when page loads
    document.addEventListener('DOMContentLoaded', function () {
      const videos = document.querySelectorAll('video');

      // Force autoplay for all videos
      videos.forEach((video, index) => {
        // Remove any controls
        video.controls = false;
        video.setAttribute('controls', 'false');

        // Try to play immediately
        const playPromise = video.play();

        if (playPromise !== undefined) {
          playPromise.catch(error => {
            // If autoplay fails, try again after a short delay
            setTimeout(() => {
              video.play().catch(err => {
                console.log(`Video ${index + 1} autoplay failed:`, err);
              });
            }, 500);
          });
        }

        // Ensure video stays muted and loops
        video.muted = true;
        video.loop = true;

        // Prevent any user interaction with videos
        video.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
        });

        video.addEventListener('contextmenu', function (e) {
          e.preventDefault();
        });

        // Restart video if it ends (backup for loop)
        video.addEventListener('ended', function () {
          this.currentTime = 0;
          this.play();
        });
      });
    });

    // Smooth scroll behavior
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
          });
        }
      });
    });
  </script>
