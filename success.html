<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed - Faisal Hanif</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive(1100).css">
    <link rel="stylesheet" href="css/resposive(650).css">
    <link rel="stylesheet" href="css/animation.style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .success-container {
            max-width: 900px;
            margin: 50px auto;
            padding: 50px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            text-align: center;
            border: 1px solid #e5e7eb;
        }
        
        .success-icon {
            font-size: 100px;
            color: #10b981;
            margin-bottom: 40px;
            animation: bounce 1s ease-in-out;
            text-shadow: 0 4px 8px rgba(16, 185, 129, 0.3);
            display: block;
        }
        
        .success-icon i {
            background: linear-gradient(135deg, #10b981, #059669);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            /* Fallback for browsers that don't support background-clip */
            color: #10b981;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        
        .success-title {
            font-size: 3rem;
            color: #1f2937;
            margin-bottom: 25px;
            font-weight: 800;
            background: linear-gradient(135deg, #1f2937, #374151);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }
        
        .success-subtitle {
            font-size: 1.3rem;
            color: #6b7280;
            margin-bottom: 50px;
            font-weight: 500;
            line-height: 1.6;
        }
        
        .booking-details {
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            border-radius: 20px;
            padding: 40px;
            margin: 40px 0;
            text-align: left;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0;
            border-bottom: 1px solid #e2e8f0;
            transition: all 0.3s ease;
        }
        
        .detail-row:hover {
            background: rgba(59, 130, 246, 0.05);
            border-radius: 10px;
            padding: 18px 15px;
            margin: 0 -15px;
        }
        
        .detail-row:last-child {
            border-bottom: none;
        }
        
        .detail-label {
            font-weight: 600;
            color: #374151;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.05rem;
        }
        
        .detail-label i {
            color: #3b82f6;
            width: 20px;
            text-align: center;
        }
        
        .detail-value {
            color: #1f2937;
            font-weight: 600;
            font-size: 1.05rem;
        }
        
        .meeting-link {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            padding: 18px 40px;
            border-radius: 15px;
            text-decoration: none;
            display: inline-block;
            margin: 30px 0;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3);
            border: none;
        }
        
        .meeting-link:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(59, 130, 246, 0.4);
        }
        
        .meeting-link i {
            margin-right: 10px;
        }
        
        .action-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
        }
        
        .btn {
            padding: 15px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #059669, #047857);
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(16, 185, 129, 0.4);
        }
        
        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
            border: 2px solid #d1d5db;
        }
        
        .btn-secondary:hover {
            background: #e5e7eb;
            transform: translateY(-2px);
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .loading-content {
            text-align: center;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f4f6;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .success-container {
                margin: 20px;
                padding: 30px 20px;
            }
            
            .success-title {
                font-size: 2rem;
            }
            
            .success-icon {
                font-size: 80px;
                margin-bottom: 30px;
            }
            
            .detail-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            
            .action-buttons {
                flex-direction: row;
                align-items: center;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <h3>Processing your booking...</h3>
            <p>Please wait while we confirm your session details.</p>
        </div>
    </div>

    <!-- Success Content -->
    <div class="success-container">
        <div class="success-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        
        <h1 class="success-title">Booking Confirmed!</h1>
        <p class="success-subtitle">Your session has been successfully scheduled. You'll receive a confirmation shortly through email.</p>
        
        <div class="booking-details" id="bookingDetails">
            <!-- Booking details will be populated here -->
        </div>
        
        <!-- Meeting link removed as requested - only available in emails -->
        
        <div class="action-buttons">
            <a href="index.html" class="btn btn-primary">
                <i class="fas fa-home"></i> Back to Home
            </a>
            <a href="mailto:mehrfaisal111@gmail.com" class="btn btn-secondary">
                <i class="fas fa-envelope"></i> Contact Support
            </a>
        </div>
    </div>

    <script>
        // Initialize page and process booking
        document.addEventListener('DOMContentLoaded', function() {
            // Show loading overlay initially
            document.getElementById('loadingOverlay').style.display = 'flex';
            
            // Start processing booking
            setTimeout(async () => {
                await processBooking();
            }, 1000);
        });

        async function processBooking() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                
                const formData = {
                    clientName: urlParams.get('clientName') || 'Guest',
                    clientEmail: urlParams.get('clientEmail') || 'No email provided',
                    sessionType: urlParams.get('sessionType') || 'General Session',
                    sessionDate: urlParams.get('sessionDate') || 'Not specified',
                    sessionTimes: urlParams.get('sessionTimes') || 'Not specified',
                    timezone: urlParams.get('timezone') || 'Not specified',
                    meetingMode: urlParams.get('meetingMode') || 'google-meet',
                    sessionNotes: urlParams.get('sessionNotes') || 'No additional notes',
                    duration: urlParams.get('duration') || '30',
                    hours: urlParams.get('hours') || '1',
                    meetingLink: urlParams.get('meetingLink') || null
                };
                
                console.log('📋 Processing booking with data:', formData);
                
                // Display booking information
                displayBookingInfo(formData);
                
                // Meeting link functionality removed - links only available in emails
                
                // Hide loading overlay
                document.getElementById('loadingOverlay').style.display = 'none';
                
            } catch (error) {
                console.error('❌ Error processing booking:', error);
                
                // Hide loading overlay even on error
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        function displayBookingInfo(formData) {
            const bookingDetails = document.getElementById('bookingDetails');
            
            // Parse session times if it's a JSON string
            let sessionTimes = formData.sessionTimes;
            try {
                if (sessionTimes.startsWith('[')) {
                    sessionTimes = JSON.parse(sessionTimes).join(', ');
                }
            } catch (e) {
                // Keep original value if parsing fails
            }
            
            // Format date
            let formattedDate = formData.sessionDate;
            if (formData.sessionDate && formData.sessionDate !== 'Not specified') {
                try {
                    const date = new Date(formData.sessionDate);
                    formattedDate = date.toLocaleDateString('en-US', {
                        weekday: 'long',
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                } catch (e) {
                    // Keep original value if parsing fails
                }
            }
            
            const details = [
                { icon: 'fas fa-user', label: 'Client Name', value: formData.clientName },
                { icon: 'fas fa-envelope', label: 'Email', value: formData.clientEmail },
                { icon: 'fas fa-calendar', label: 'Session Type', value: formData.sessionType },
                { icon: 'fas fa-clock', label: 'Duration', value: `${formData.duration} minutes` },
                { icon: 'fas fa-calendar-day', label: 'Date', value: formattedDate },
                { icon: 'fas fa-clock', label: 'Time(s)', value: sessionTimes },
                { icon: 'fas fa-globe', label: 'Timezone', value: formData.timezone },
                { icon: 'fas fa-video', label: 'Platform', value: formData.meetingMode === 'google-meet' ? 'Google Meet' : 'Zoom' },
                { icon: 'fas fa-sticky-note', label: 'Notes', value: formData.sessionNotes }
            ];
            
            bookingDetails.innerHTML = details.map(detail => `
                <div class="detail-row">
                    <div class="detail-label">
                        <i class="${detail.icon}"></i>
                        ${detail.label}
                    </div>
                    <div class="detail-value">${detail.value}</div>
                </div>
            `).join('');
        }

        function generateMeetingLink(formData) {
            // Generate session ID from URL params or create a fallback
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('sessionId') || 'SES-' + Date.now().toString().slice(-8);
            
            if (formData.meetingMode === 'google-meet') {
                // Use Google Meet's instant meeting feature which creates a real meeting room
                return 'https://meet.google.com/new';
            } else if (formData.meetingMode === 'zoom') {
                // Generate Zoom link with consistent meeting ID based on session ID
                const meetingId = generateZoomMeetingId(sessionId);
                const password = generateZoomPassword(sessionId);
                return `https://zoom.us/j/${meetingId}?pwd=${password}`;
            }
            return 'https://meet.google.com/new';
        }
        
        function generateGoogleMeetRoomId(sessionId) {
             // Generate a consistent Google Meet room ID format: abc-defg-hij
             const hash = simpleHash(sessionId);
             // Use alphanumeric characters for valid Google Meet room ID
             const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
             let roomId = '';
             
             // Convert hash to valid room ID format (10 characters total)
             for (let i = 0; i < 10; i++) {
                 const index = parseInt(hash.charAt(i), 16) % chars.length;
                 roomId += chars[index];
             }
             
             // Format as abc-defg-hij (3-4-3 format)
             return `${roomId.substring(0, 3)}-${roomId.substring(3, 7)}-${roomId.substring(7, 10)}`;
         }
        
        function generateZoomMeetingId(sessionId) {
            // Generate consistent 9-digit Zoom meeting ID
            const hash = simpleHash(sessionId);
            const numericHash = parseInt(hash, 16);
            return (numericHash % 900000000) + 100000000;
        }
        
        function generateZoomPassword(sessionId) {
            // Generate consistent 6-character password
            const hash = simpleHash(sessionId + 'pwd');
            return hash.substring(0, 6).toUpperCase();
        }
        
        function simpleHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash; // Convert to 32-bit integer
            }
            return Math.abs(hash).toString(16).padStart(10, '0');
        }
    </script>
</body>
</html>
